name: H5000M ImmortalWrt 25.12 HNAT USB build

on:
  push:
    branches: [main, hnat-6.12, audit-upgrade-2026-10, hnat-usb-experimental-20261017]
  workflow_dispatch:
    inputs:
      confirm_firmware_build:
        description: Build the firmware (otherwise run validation only)
        required: true
        default: false
        type: boolean
      threads:
        description: Build parallelism
        required: false
        default: '8'
        type: string
      diagnose_libffi:
        description: Build only libffi and required prerequisites with V=s
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Keep push validation and explicitly dispatched builds from cancelling
  # one another on the same ref.
  group: h5000m-25.12-hnat-usb-${{ github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 468e251661cb46face4ca0c961238282a6eaaa0a
  SOURCE_REF: 25.12
  TARGET: mediatek/filogic
  DEVICE: hiveton_h5000m
  TZ: Asia/Shanghai

jobs:
  validate:
    name: Static upstream/config audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax and repository hygiene
        run: |
          set -euxo pipefail
          bash -n scripts/local-build.sh scripts/verify-config.sh
          test "$(find patches -maxdepth 1 -type f | wc -l)" -eq 14
          test -s patches/976-mtkhnat-probe-safe.patch
          test -s patches/977-mtkhnat-autoload.patch
          test -s patches/978-h5000m-hnat-usb-node.patch
          test -s patches/999-eth-96-hnat-ppe-unwind-guard.patch
          if find . -path './.git' -prune -o -type f -print | grep -Eq 'h5000m-kit|mtwifi|Airpifanctrl|turboacc|padavanonly|openwrt-24\.10'; then
            echo 'forbidden legacy path found' >&2
            exit 1
          fi
          test -f vendor/mt76/Makefile
          test -s vendor/mt76/patches/0118-wifi-mt76-mt7996-fix-wed-rro-ba-delete-event-layout.patch
          grep -q 'bd49f06353d7e8cdfa1458912ba9a866870cb795' vendor/mt76/README.md
          grep -q 'chasey-dev/immortalwrt-mt798x-rebase' README.md
          grep -q '468e251661cb46face4ca0c961238282a6eaaa0a' README.md
          grep -q '6.12.113' README.md
          test -s patches/968-linux-6.12.113.patch
          test -s patches/969-qmodem-sms-timestamp-utc8.patch
          test -s patches/974-mtk-eth-napi-helper-6.12.113.patch
          test -s patches/975-mtkhnat91-6.12.113-compat.patch
          grep -q 'ce35a9e4ef1b87fbbc2146036ce6693e4242861a' vendor/mt76/README.md

      - name: Upstream source/config preflight
        env:
          THREADS: '2'
        run: |
          set -euxo pipefail
          # This performs a fresh clone of the pinned 25.12-based source, pinned-feed setup, patch
          # application, make defconfig and all static audits. No old source
          # tree or target/object cache is available in this job.
          bash scripts/local-build.sh --config-only

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-25.12-HNAT-USB-validation-${{ github.sha }}
          path: |
            immortalwrt/.config
            immortalwrt/feeds.conf.default
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  build:
    name: Build H5000M firmware
    if: github.event_name == 'workflow_dispatch' && (inputs.confirm_firmware_build == true || inputs.diagnose_libffi == true)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ccache git gawk gettext patch rsync unzip wget curl bc \
            file python3 python3-pyelftools libncurses5-dev libncursesw5-dev \
            libssl-dev zlib1g-dev libelf-dev libtool autoconf automake bison flex \
            device-tree-compiler gcc-multilib g++-multilib lib32gcc-s1 libc6-dev-i386 \
            squashfs-tools zstd xz-utils time

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: ${{ runner.os }}-dl-${{ env.SOURCE_COMMIT }}-${{ env.TARGET }}-aarch64-gcc14-musl-k6.12-${{ hashFiles('feeds.conf.default', 'config/**', 'patches/**', 'scripts/**', 'vendor/**') }}
          restore-keys: |
            ${{ runner.os }}-dl-${{ env.SOURCE_COMMIT }}-${{ env.TARGET }}-aarch64-gcc14-musl-k6.12-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: immortalwrt/.ccache
          key: ${{ runner.os }}-ccache-${{ env.SOURCE_COMMIT }}-${{ env.TARGET }}-aarch64-gcc14-musl-k6.12-${{ env.DEVICE }}-${{ hashFiles('config/**', 'patches/**', 'feeds.conf.default', 'vendor/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.SOURCE_COMMIT }}-${{ env.TARGET }}-aarch64-gcc14-musl-k6.12-${{ env.DEVICE }}-

      - name: Build firmware
        env:
          THREADS: ${{ inputs.threads || '8' }}
          CCACHE_DIR: ${{ github.workspace }}/immortalwrt/.ccache
        run: |
          set -euxo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          if [[ "${{ inputs.diagnose_libffi }}" == "true" ]]; then
            if [[ "${{ inputs.confirm_firmware_build }}" == "true" ]]; then
              bash scripts/local-build.sh --libffi-then-build
            else
              bash scripts/local-build.sh --libffi-only
            fi
          else
            bash scripts/local-build.sh --libffi-then-build
          fi

      - name: Gather libffi diagnostic inputs
        if: always() && inputs.diagnose_libffi == true
        run: |
          set -eu
          mkdir -p diagnostic/libffi
          [ ! -f build.log ] || cp build.log diagnostic/libffi/
          if [ -d immortalwrt/build_dir ]; then
            find immortalwrt/build_dir -type f \
              \( -name config.log -o -name fficonfig.h.in -o -name fficonfig.h \) \
              -print > diagnostic/libffi/files-found.txt
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              mkdir -p "diagnostic/libffi/$(dirname "$f")"
              cp -p "$f" "diagnostic/libffi/$f"
            done < diagnostic/libffi/files-found.txt
          fi
          {
            echo "repository_commit=${GITHUB_SHA}"
            echo "upstream_commit=${SOURCE_COMMIT}"
            echo "target=${TARGET}"
            echo "device=${DEVICE}"
            [ ! -f immortalwrt/.config ] || sha256sum immortalwrt/.config
            [ ! -f immortalwrt/feeds.conf.default ] || sha256sum immortalwrt/feeds.conf.default
          } > diagnostic/libffi/BUILD-INPUTS.txt

      - name: Upload first-attempt build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-25.12-HNAT-USB-build-log-${{ github.sha }}
          path: |
            build.log
            diagnostic/libffi/**
            immortalwrt/.config
            immortalwrt/feeds.conf.default
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Reverse-audit final image inputs
        if: inputs.confirm_firmware_build == true
        run: |
          set -euxo pipefail
          test -s artifacts/build.config
          test -s artifacts/H5000M-IDENTITY.txt
          test -s artifacts/sha256sums.txt
          grep -q 'source_commit=468e251661cb46face4ca0c961238282a6eaaa0a' artifacts/H5000M-IDENTITY.txt
          grep -q 'wifi_stack=official mt76' artifacts/H5000M-IDENTITY.txt
          grep -q 'board_patches=968+969+970+971+972+973+975+976+977+978 applied; ethernet_debugfs_patches=94+95+96; independent mtkhnat + NETSYS-v3 + nft-offload; upstream thermal trips retained' artifacts/H5000M-IDENTITY.txt
          grep -q '^kernel=6.12.113$' artifacts/H5000M-IDENTITY.txt
          grep -q 'modem_support=QModem Next + standalone WebUI/AT role mapping/QSCAN/QMI recovery; WeCom adapter installed' artifacts/H5000M-IDENTITY.txt
          grep -q 'private_config=user-supplied; no subscription, webhook key, password, or proxy secret embedded' artifacts/H5000M-IDENTITY.txt
          grep -q '^CONFIG_TARGET_mediatek=y$' artifacts/build.config
          grep -q '^CONFIG_TARGET_mediatek_filogic=y$' artifacts/build.config
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_hiveton_h5000m=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_luci-app-qmodem-next=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_h5000m-fancontrol=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_h5000m-modem-support=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_h5000m-network-guard=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_smartdns=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_luci-app-smartdns=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_sms-forwarder-next=y$' artifacts/build.config
          ! grep -q '^CONFIG_PACKAGE_sendat=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-hwmon-pwmfan=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-mediatek_hnat=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_hnat-detect=y$' artifacts/build.config
          grep -q '^CONFIG_MEDIATEK_NETSYS_V3=y$' immortalwrt/target/linux/mediatek/filogic/config-6.12
          grep -q 'CONFIG_NET_MEDIATEK_HNAT' immortalwrt/package/kernel/linux/modules/netdevices.mk
          grep -q '^CONFIG_PACKAGE_kmod-nf-conntrack=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-nf-nat=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-nft-offload=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-nft-fullcone=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-nf-flow=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-tcp-bbr=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-cryptodev=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-tls=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_luci-app-sqm=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-mt7996e=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-mt76-core=y$' artifacts/build.config
          grep -q '^CONFIG_CCACHE=y$' artifacts/build.config
          ! grep -q '^CONFIG_NEED_BPF_TOOLCHAIN=y$' artifacts/build.config
          [ ! -d immortalwrt/staging_dir/host/llvm-bpf ]
          grep -q '^CONFIG_NET_MEDIATEK_SOC_WED=y$' immortalwrt/target/linux/mediatek/filogic/config-6.12
          grep -qx 'CONFIG_IPV6=y' immortalwrt/target/linux/mediatek/filogic/config-6.12
          grep -qx 'LINUX_VERSION-6.12 = .113' immortalwrt/target/linux/generic/kernel-6.12
          grep -qx 'LINUX_KERNEL_HASH-6.12.113 = e09b6727e5c521253f0d41694900b9c38fb7604db7d35238a8197aa9f7de2428' immortalwrt/target/linux/generic/kernel-6.12
          ! test -f immortalwrt/target/linux/generic/backport-6.12/788-v7.3-net-usb-qmi_wwan-add-Quectel-EG120K-EA.patch
          test -s immortalwrt/target/linux/generic/backport-6.12-superseded/788-v7.3-net-usb-qmi_wwan-add-Quectel-EG120K-EA.patch
          cmp patches/974-mtk-eth-napi-helper-6.12.113.patch immortalwrt/target/linux/mediatek/patches-6.12/999-eth-07-mtk_eth_soc-fix-panic-issue-with-napi_enable.patch
          test -s immortalwrt/target/linux/mediatek/patches-6.12-superseded/999-eth-07-mtk_eth_soc-fix-panic-issue-with-napi_enable.patch
          test -s immortalwrt/target/linux/mediatek/patches-6.12-superseded/999-eth-91-mtk_eth_soc-add-mtkhnat-driver-support.patch
          grep -Fq 'kernel_updates=Linux 6.12.113 stable (kernel.org SHA256 pinned); duplicate QMI/NAPI backports preserved out of queue' artifacts/H5000M-IDENTITY.txt
          qmi_src=$(find immortalwrt/build_dir -type f -path '*/drivers/net/usb/qmi_wwan.c' -print -quit)
          test -n "$qmi_src"
          grep -Fq 'QMI_MATCH_FF_FF_FF(0x2c7c, 0x030b)' "$qmi_src"
          eth_src=$(find immortalwrt/build_dir -type f -path '*/drivers/net/ethernet/mediatek/mtk_eth_soc.c' -print -quit)
          test -n "$eth_src"
          python3 - "$eth_src" <<'PY'
          import pathlib, sys
          s=pathlib.Path(sys.argv[1]).read_text()
          probe=s[s.find('static int mtk_probe('):]
          assert probe.find('alloc_netdev_dummy(0)') < probe.find('register_netdev(eth->netdev[i])')
          assert probe.find('netif_napi_add(eth->dummy_dev') < probe.find('register_netdev(eth->netdev[i])')
          print('MTK dummy netdev/NAPI setup precedes netdev registration')
          PY
          eth_src=$(find immortalwrt/build_dir -type f -path '*/drivers/net/ethernet/mediatek/mtk_eth_soc.c' -print -quit)
          test -n "$eth_src"
          python3 - "$eth_src" <<'PY'
          import pathlib, sys
          s=pathlib.Path(sys.argv[1]).read_text()
          probe=s[s.find('static int mtk_probe('):]
          assert probe.find('alloc_netdev_dummy(0)') < probe.find('register_netdev(eth->netdev[i])')
          assert probe.find('netif_napi_add(eth->dummy_dev') < probe.find('register_netdev(eth->netdev[i])')
          print('MTK dummy netdev/NAPI setup precedes netdev registration')
          PY
          grep -q 'GIC_SPI 189 IRQ_TYPE_LEVEL_HIGH' immortalwrt/target/linux/mediatek/dts/mt7987.dtsi
          grep -q 'GIC_SPI 192 IRQ_TYPE_LEVEL_HIGH' immortalwrt/target/linux/mediatek/dts/mt7987.dtsi
          grep -q 'mtketh-soc = <&eth>;' immortalwrt/target/linux/mediatek/dts/mt7987a-hiveton-h5000m.dts
          grep -q 'compatible = "mediatek,mtk-hnat_v5"' immortalwrt/target/linux/mediatek/dts/mt7987a-hiveton-h5000m.dts
          grep -q 'ext-devices-prefix = "usb", "wwan", "rmnet"' immortalwrt/target/linux/mediatek/dts/mt7987a-hiveton-h5000m.dts
          grep -q 'AUTOLOAD:=$(call AutoLoad,90,mtkhnat)' immortalwrt/package/kernel/linux/modules/netdevices.mk
          grep -q 'compatible = "mediatek,mt7987-wed"' immortalwrt/target/linux/mediatek/dts/mt7987.dtsi
          grep -q 'interrupts = <GIC_SPI 205 IRQ_TYPE_LEVEL_HIGH>;' immortalwrt/target/linux/mediatek/dts/mt7987.dtsi
          grep -q 'mediatek,wed = <&wed0>;' immortalwrt/target/linux/mediatek/dts/mt7987.dtsi
          grep -q '^CONFIG_PACKAGE_kmod-mt7992-23-firmware=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_mt7987-2p5g-phy-firmware=y$' artifacts/build.config
          ! grep -qE '^CONFIG_PACKAGE_(luci-app-(nikki|mosdns|homeproxy|turboacc-mtk|Airpifanctrl)|modemmanager|h5000m-kit)=y$' artifacts/build.config
          grep -q 'hiveton_h5000m-initramfs-kernel.bin' <(find artifacts -maxdepth 1 -type f -printf '%f\n')
          grep -q 'hiveton_h5000m-squashfs-sysupgrade.bin' <(find artifacts -maxdepth 1 -type f -printf '%f\n')
          grep -q '^kmod-mediatek_hnat - ' artifacts/openwrt-image.manifest
          grep -q '^hnat-detect - ' artifacts/openwrt-image.manifest
          grep -q '^kmod-nf-conntrack - ' artifacts/openwrt-image.manifest
          grep -q '^kmod-nf-nat - ' artifacts/openwrt-image.manifest
          grep -q '^kmod-nft-offload - ' artifacts/openwrt-image.manifest
          grep -q '^kmod-nft-fullcone - ' artifacts/openwrt-image.manifest
          grep -q '^kmod-nf-flow - ' artifacts/openwrt-image.manifest
          grep -q '^kmod-tcp-bbr - ' artifacts/openwrt-image.manifest
          grep -q '^kmod-usb3 - ' artifacts/openwrt-image.manifest
          grep -q '^kmod-qmi_wwan_q - ' artifacts/openwrt-image.manifest
          grep -q '^kmod-mt7996e - ' artifacts/openwrt-image.manifest
          grep -q '^kmod-mt7992-23-firmware - ' artifacts/openwrt-image.manifest
          grep -q '^h5000m-modem-support - ' artifacts/openwrt-image.manifest
          grep -q '^h5000m-network-guard - ' artifacts/openwrt-image.manifest
          grep -q '^smartdns - ' artifacts/openwrt-image.manifest
          grep -q '^luci-app-smartdns - ' artifacts/openwrt-image.manifest
          grep -q '^sms-forwarder-next - ' artifacts/openwrt-image.manifest
          ! grep -q '^sendat - ' artifacts/openwrt-image.manifest
          grep -q 'h5000m-fancontrol' artifacts/openwrt-image.manifest
          grep -q 'kmod-mt7992-23-firmware' artifacts/openwrt-image.manifest
          grep -q 'luci-app-openclash' artifacts/openwrt-image.manifest
          grep -q 'luci-app-qmodem-next' artifacts/openwrt-image.manifest
          (cd artifacts && sha256sum -c sha256sums.txt)

      - name: Upload firmware and provenance
        if: inputs.confirm_firmware_build == true
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-ImmortalWrt-25.12-HNAT-USB-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: ccache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ github.workspace }}/immortalwrt/.ccache
        run: ccache -s || true

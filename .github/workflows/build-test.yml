name: H5000M ImmortalWrt 25.12.2 official baseline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_firmware_build:
        description: Build the firmware (otherwise run validation only)
        required: true
        default: false
        type: boolean
      threads:
        description: Build parallelism
        required: false
        default: '2'
        type: string
      diagnose_libffi:
        description: Build only libffi and required prerequisites with V=s
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Keep push validation and explicitly dispatched builds from cancelling
  # one another on the same ref.
  group: h5000m-25.12.2-${{ github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 4fc16f2985a358bd43bb522e43f05395fcbd6ed5
  SOURCE_REF: v25.12.2
  TARGET: mediatek/filogic
  DEVICE: hiveton_h5000m
  TZ: Asia/Shanghai

jobs:
  validate:
    name: Static upstream/config audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax and repository hygiene
        run: |
          set -euxo pipefail
          bash -n scripts/local-build.sh scripts/verify-config.sh
          test "$(find patches -maxdepth 1 -type f | wc -l)" -eq 3
          ! find . -path './.git' -prune -o -type f -print | grep -E 'h5000m-kit|mtwifi|Airpifanctrl|turboacc|chasey|padavanonly|openwrt-24\.10' || true
          grep -q 'immortalwrt/immortalwrt' README.md
          grep -q '4fc16f2985a358bd43bb522e43f05395fcbd6ed5' README.md

      - name: Upstream source/config preflight
        env:
          THREADS: '2'
        run: |
          set -euxo pipefail
          # This performs a fresh official clone, pinned-feed setup, patch
          # application, make defconfig and all static audits. No old source
          # tree or target/object cache is available in this job.
          bash scripts/local-build.sh --config-only

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-25.12.2-validation-${{ github.sha }}
          path: |
            immortalwrt/.config
            immortalwrt/feeds.conf.default
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build official H5000M firmware
    if: github.event_name == 'workflow_dispatch' && (inputs.confirm_firmware_build == true || inputs.diagnose_libffi == true)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ccache git gawk gettext patch rsync unzip wget curl \
            file python3 python3-pyelftools libncurses5-dev libncursesw5-dev \
            libssl-dev zlib1g-dev libelf-dev libtool autoconf automake bison flex \
            device-tree-compiler gcc-multilib g++-multilib lib32gcc-s1 libc6-dev-i386 \
            squashfs-tools zstd xz-utils time

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: ${{ runner.os }}-dl-${{ env.SOURCE_COMMIT }}-${{ hashFiles('feeds.conf.default', 'config/**', 'patches/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-dl-${{ env.SOURCE_COMMIT }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ env.SOURCE_COMMIT }}-${{ env.TARGET }}-${{ env.DEVICE }}-${{ hashFiles('config/**', 'patches/**', 'feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.SOURCE_COMMIT }}-${{ env.TARGET }}-${{ env.DEVICE }}-

      - name: Build firmware
        env:
          THREADS: ${{ inputs.threads || '2' }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euxo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          if [[ "${{ inputs.diagnose_libffi }}" == "true" ]]; then
            if [[ "${{ inputs.confirm_firmware_build }}" == "true" ]]; then
              bash scripts/local-build.sh --libffi-then-build
            else
              bash scripts/local-build.sh --libffi-only
            fi
          else
            bash scripts/local-build.sh
          fi

      - name: Gather libffi diagnostic inputs
        if: always() && inputs.diagnose_libffi == true
        run: |
          set -eu
          mkdir -p diagnostic/libffi
          [ ! -f build.log ] || cp build.log diagnostic/libffi/
          if [ -d immortalwrt/build_dir ]; then
            find immortalwrt/build_dir -type f \
              \( -name config.log -o -name fficonfig.h.in -o -name fficonfig.h \) \
              -print > diagnostic/libffi/files-found.txt
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              mkdir -p "diagnostic/libffi/$(dirname "$f")"
              cp -p "$f" "diagnostic/libffi/$f"
            done < diagnostic/libffi/files-found.txt
          fi
          {
            echo "repository_commit=${GITHUB_SHA}"
            echo "upstream_commit=${SOURCE_COMMIT}"
            echo "target=${TARGET}"
            echo "device=${DEVICE}"
            [ ! -f immortalwrt/.config ] || sha256sum immortalwrt/.config
            [ ! -f immortalwrt/feeds.conf.default ] || sha256sum immortalwrt/feeds.conf.default
          } > diagnostic/libffi/BUILD-INPUTS.txt

      - name: Upload first-attempt build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-25.12.2-build-log-${{ github.sha }}
          path: |
            build.log
            diagnostic/libffi/**
            immortalwrt/.config
            immortalwrt/feeds.conf.default
          if-no-files-found: warn
          retention-days: 14

      - name: Reverse-audit final image inputs
        if: inputs.confirm_firmware_build == true
        run: |
          set -euxo pipefail
          test -s artifacts/build.config
          test -s artifacts/H5000M-IDENTITY.txt
          test -s artifacts/sha256sums.txt
          grep -q 'source_commit=4fc16f2985a358bd43bb522e43f05395fcbd6ed5' artifacts/H5000M-IDENTITY.txt
          grep -q 'wifi_stack=official mt76' artifacts/H5000M-IDENTITY.txt
          grep -q 'fan_patches=970+971 applied; 972 retained-not-applied (DTS unchanged)' artifacts/H5000M-IDENTITY.txt
          grep -q '^CONFIG_TARGET_mediatek=y$' artifacts/build.config
          grep -q '^CONFIG_TARGET_mediatek_filogic=y$' artifacts/build.config
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_hiveton_h5000m=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_luci-app-qmodem-next=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-mt7996e=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_kmod-mt7992-23-firmware=y$' artifacts/build.config
          grep -q '^CONFIG_PACKAGE_mt7987-2p5g-phy-firmware=y$' artifacts/build.config
          ! grep -qE '^CONFIG_PACKAGE_(luci-app-(nikki|mosdns|homeproxy|turboacc-mtk|Airpifanctrl)|modemmanager|h5000m-kit)=y$' artifacts/build.config
          grep -q 'hiveton_h5000m-initramfs-kernel.bin' <(find artifacts -maxdepth 1 -type f -printf '%f\n')
          grep -q 'hiveton_h5000m-squashfs-sysupgrade.bin' <(find artifacts -maxdepth 1 -type f -printf '%f\n')
          (cd artifacts && sha256sum -c sha256sums.txt)

      - name: Upload firmware and provenance
        if: inputs.confirm_firmware_build == true
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-ImmortalWrt-25.12.2-official-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: ccache statistics
        if: always()
        run: ccache -s || true
